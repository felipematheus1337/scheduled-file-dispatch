spring:
  application:
    name: scheduled-file-dispatch

  config:
    import: "optional:file:./.env[.properties]"

  datasource:
    url: "jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:scheduled_file_dispatch}"
    username: "${POSTGRES_USER}"
    password: "${POSTGRES_PASSWORD}"

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update

  rabbitmq:
    host: "${RABBITMQ_HOST:localhost}"
    port: ${RABBITMQ_PORT:5672}
    username: "${RABBITMQ_USER}"
    password: "${RABBITMQ_PASSWORD}"

  mail:
    host: "${MAIL_HOST:localhost}"
    port: ${MAIL_SMTP_PORT:1025}
    properties:
      "[mail.smtp.auth]": false
      "[mail.smtp.starttls.enable]": false
      "[mail.smtp.connectiontimeout]": 5000
      "[mail.smtp.timeout]": 5000
      "[mail.smtp.writetimeout]": 5000

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 16MB

app:
  storage:
    s3:
      endpoint: "${S3_ENDPOINT:http://localhost:4566}"
      region: "${S3_REGION:us-east-1}"
      bucket: "${S3_BUCKET}"
      access-key: "${S3_ACCESS_KEY:test}"
      secret-key: "${S3_SECRET_KEY:test}"

  mail:
    from: "${MAIL_FROM:no-reply@scheduled-file-dispatch.local}"

  messaging:
    queue: scheduled-file-dispatch.send

  scheduler:
    cron: "0 * * * * *"

  security:
    jwt:
      secret: "${JWT_SECRET}"
      issuer: scheduled-file-dispatch
      ttl: PT1H

resilience4j:
  retry:
    instances:
      s3Storage:
        max-attempts: 3
        wait-duration: 500ms

  circuitbreaker:
    instances:
      s3Storage:
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3

management:
  endpoints:
    web:
      exposure:
        include: health,info